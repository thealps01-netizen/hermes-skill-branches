name: skill-branches
label: Skill Branches
version: 0.1.0
description: >-
  Routes each user turn to a branch of skills. Reads a branch file (name, one-line description,
  skill names) from the plugin's data folder, lists the branches once per session in the system
  prompt, and on every turn asks the model to name the branch the message belongs to, or none, and
  to load with skill_view the skills of that branch that apply. It never loads skills itself. A
  missing or invalid file adds nothing and logs one warning when invalid.
author: Muhammed Enes Alpler
kind: standalone
requires_hermes: ">=0.22.2"
provides_hooks:
  - pre_llm_call
